[package]
name = "tangothreadmeasurements"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt

[dev-dependencies]
tango-bench = "0.9.0"
# tango-bench = { version = "1.0.0", path="../tango/tango-bench" }

[[bench]]
name = "bencha"
harness = false

[dependencies]
thousands = "0.2.0"

# simplebench needs nightly (#![feature(test)]): `cargo +nightly bench --features nightly`.
[features]
nightly = []

[[bin]]
name = "simplebench"
path = "src/bin/simplebench.rs"
required-features = ["nightly"]

[[bench]]
name = "benchthreads"
harness = false
